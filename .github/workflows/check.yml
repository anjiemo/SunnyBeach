# CI 编译检查；非 PR 时向飞书推送状态卡片
# Secrets（勿硬编码）:
#   FEISHU_CI_WEBHOOK_URL / FEISHU_CI_WEBHOOK_SECRET
name: CI 编译检查

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main", "master", "dev" ]
    paths-ignore:
      - '**.md'
      - '.trellis/**'
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 解析元数据
        if: github.event_name != 'pull_request'
        id: meta
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER_LABEL="手动触发"
          else
            TRIGGER_LABEL="自动触发"
          fi

          BUILD_TYPE_LABEL="CI 检查"

          APP_NAME=$(grep -oP 'name="app_name">\K[^<]+' app/src/main/res/values/strings.xml | head -n 1 || true)
          if [ -z "${APP_NAME}" ]; then
            APP_NAME="SunnyBeach"
          fi

          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            BRANCH="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            BRANCHES=$(git branch -r --contains HEAD 2>/dev/null || true)
            if echo "${BRANCHES}" | grep -q 'origin/dev$'; then
              BRANCH="dev"
            elif echo "${BRANCHES}" | grep -q 'origin/main$'; then
              BRANCH="main"
            else
              BRANCH=$(echo "${BRANCHES}" | sed 's|^[[:space:]]*origin/||' | head -n 1 | tr -d '[:space:]')
              [ -z "${BRANCH}" ] && BRANCH="-"
            fi
          else
            BRANCH="-"
          fi

          VERSION_CODE=$(grep -E '^versionCode=' version.properties | cut -d= -f2- | tr -d '[:space:]')
          VERSION_NAME=$(grep -E '^versionName=' version.properties | cut -d= -f2- | tr -d '[:space:]')

          GIT_SHA=$(git rev-parse --short=7 HEAD)
          GIT_MESSAGE=$(git log -1 --pretty=%s)

          CREATED_AT=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_ID="${{ github.run_number }}"

          {
            echo "trigger_label=${TRIGGER_LABEL}"
            echo "build_type_label=${BUILD_TYPE_LABEL}"
            echo "app_name=${APP_NAME}"
            echo "branch=${BRANCH}"
            echo "version_code=${VERSION_CODE}"
            echo "version_name=${VERSION_NAME}"
            echo "git_sha=${GIT_SHA}"
            echo "created_at=${CREATED_AT}"
            echo "run_url=${RUN_URL}"
            echo "build_id=${BUILD_ID}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "git_message<<EOF"
            echo "${GIT_MESSAGE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 须在「检查开始」之前解析，使开始卡片也能带真实 JOB_URL（成功/失败复用）
      - name: 解析 Job URL
        if: github.event_name != 'pull_request'
        id: joburl
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          JOB_URL=""
          JOB_NAME="${{ github.job }}"
          # gh api 无 --arg；用 jq --arg 按 job id（默认即 name）匹配，再回退最新 job
          JOBS_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" 2>/dev/null)
          if [ -n "${JOBS_JSON}" ]; then
            JOB_URL=$(printf '%s' "${JOBS_JSON}" | jq -r --arg name "${JOB_NAME}" \
              '.jobs[] | select(.name == $name) | .html_url' 2>/dev/null | head -n 1)
            if [ -z "${JOB_URL}" ] || [ "${JOB_URL}" = "null" ]; then
              JOB_URL=$(printf '%s' "${JOBS_JSON}" | jq -r \
                '.jobs | sort_by(.started_at) | reverse | .[0].html_url // empty' 2>/dev/null)
            fi
          fi
          if [ -z "${JOB_URL}" ] || [ "${JOB_URL}" = "null" ]; then
            JOB_URL="${{ steps.meta.outputs.run_url }}"
            echo "::warning::未能解析 Job html_url，回退为 RUN_URL"
          fi
          echo "job_url=${JOB_URL}" >> "$GITHUB_OUTPUT"
          set -e

      - name: 飞书通知 — 检查开始
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_CI_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.FEISHU_CI_WEBHOOK_SECRET }}
          STATUS: start
          SCENE: check
          BUILD_ID: ${{ steps.meta.outputs.build_id }}
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          BUILD_TYPE_LABEL: ${{ steps.meta.outputs.build_type_label }}
          TRIGGER_LABEL: ${{ steps.meta.outputs.trigger_label }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          GIT_MESSAGE: ${{ steps.meta.outputs.git_message }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          JOB_URL: ${{ steps.joburl.outputs.job_url || steps.meta.outputs.run_url }}
          CREATED_AT: ${{ steps.meta.outputs.created_at }}
          UPDATED_AT: ${{ steps.meta.outputs.created_at }}
        run: bash .github/scripts/feishu_notify.sh

      - name: 设置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 执行编译检查
        run: |
          ./gradlew :app:assembleDebug --stacktrace || (
            echo "Build failed, retrying in 15s..."
            sleep 15
            ./gradlew :app:assembleDebug --stacktrace
          )
        env:
          GRADLE_OPTS: >-
            -Xmx2g
            -Dfile.encoding=UTF-8
            -Dorg.gradle.internal.http.connectionTimeout=180000
            -Dorg.gradle.internal.http.socketTimeout=180000
          CI_BUILD: "true"

      - name: 飞书通知 — 检查成功
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_CI_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.FEISHU_CI_WEBHOOK_SECRET }}
          STATUS: success
          SCENE: check
          BUILD_ID: ${{ steps.meta.outputs.build_id }}
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          BUILD_TYPE_LABEL: ${{ steps.meta.outputs.build_type_label }}
          TRIGGER_LABEL: ${{ steps.meta.outputs.trigger_label }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          GIT_MESSAGE: ${{ steps.meta.outputs.git_message }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          JOB_URL: ${{ steps.joburl.outputs.job_url || steps.meta.outputs.run_url }}
          CREATED_AT: ${{ steps.meta.outputs.created_at }}
        run: |
          UPDATED_AT=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          export UPDATED_AT
          bash .github/scripts/feishu_notify.sh

      - name: 飞书通知 — 检查失败
        if: failure() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_CI_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.FEISHU_CI_WEBHOOK_SECRET }}
          STATUS: failure
          SCENE: check
          BUILD_ID: ${{ steps.meta.outputs.build_id }}
          APP_NAME: ${{ steps.meta.outputs.app_name }}
          BUILD_TYPE_LABEL: ${{ steps.meta.outputs.build_type_label }}
          TRIGGER_LABEL: ${{ steps.meta.outputs.trigger_label }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          GIT_SHA: ${{ steps.meta.outputs.git_sha }}
          GIT_MESSAGE: ${{ steps.meta.outputs.git_message }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          JOB_URL: ${{ steps.joburl.outputs.job_url || steps.meta.outputs.run_url }}
          CREATED_AT: ${{ steps.meta.outputs.created_at }}
        run: |
          UPDATED_AT=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          export UPDATED_AT
          bash .github/scripts/feishu_notify.sh
